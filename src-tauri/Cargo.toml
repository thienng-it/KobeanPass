[package]
name = "kobeanpass"
version = "0.1.0"
description = "KobeanPass — Local-First Zero-Knowledge Password Manager"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "kobeanpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri v2 ──
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"

# ── Cryptography (Audited RustCrypto) ──
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"

# ── Memory Protection & Zeroization ──
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }

# ── Random Number Generation ──
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Encrypted SQLite ──
rusqlite = { version = "0.33", features = ["bundled-sqlcipher", "bundled"] }

# ── Identifiers & Encodings ──
uuid = { version = "1.12", features = ["v4", "fast-rng", "serde"] }
base64 = "0.22"
hex = "0.4"

# ── OS Keychain ──
keyring = { version = "3.0", features = ["apple-native", "windows-native", "sync-secret-service"] }

# ── Timestamps ──
chrono = { version = "0.4", features = ["serde"] }

# ── Error Handling ──
thiserror = "2.0"

# ── Password Strength ──
zxcvbn = "3.1"

# ── TOTP (RFC 6238) ──
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth", "qr"] }

# ── Async Runtime ──
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# ── Platform specifics ──
[target.'cfg(unix)'.dependencies]
libc = "0.2"
